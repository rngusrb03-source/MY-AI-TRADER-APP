name: Docker Build & Deploy to Azure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ${{ secrets.AZURE_REGISTRY_SERVER }}
  REGISTRY_USERNAME: ${{ secrets.AZURE_REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      # Frontend 빌드 및 Push
      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/my-ai-trader-frontend:latest
            ${{ env.REGISTRY }}/my-ai-trader-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/my-ai-trader-frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/my-ai-trader-frontend:buildcache,mode=max

      # Backend 빌드 및 Push
      - name: Build and push Backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/my-ai-trader-backend:latest
            ${{ env.REGISTRY }}/my-ai-trader-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/my-ai-trader-backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/my-ai-trader-backend:buildcache,mode=max

  deploy-frontend:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Frontend to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: my-ai-trader-front-01
          images: ${{ env.REGISTRY }}/my-ai-trader-frontend:latest

      - name: Azure Logout
        run: az logout

  deploy-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Backend to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: my-ai-trader-backend
          images: ${{ env.REGISTRY }}/my-ai-trader-backend:latest

      - name: Azure Logout
        run: az logout
