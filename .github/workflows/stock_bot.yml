name: 주식 감성 분석 봇 매일 실행

on:
  schedule:
    # 매일 아침 8시 30분(한국 시간)에 자동으로 실행되도록 설정
    # (세계 표준시 UTC 기준으로는 전날 23시 30분입니다)
    - cron: '30 23 * * *' 
  workflow_dispatch: # 사용자님이 원할 때 언제든 수동으로 실행 버튼을 누를 수 있게 합니다.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 필요한 라이브러리 설치
      run: |
        pip install requests beautifulsoup4 textblob pandas

    - name: 주식 분석 코드 실행
      run: python main.py

    - name: 분석된 엑셀 결과 저장소에 업데이트
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add .
        git commit -m "매일 아침 주식 분석 데이터 자동 업데이트 완료" || exit 0
        git push
